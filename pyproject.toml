[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdpmigrator"
version = "0.1.0"
description = "A schema migration utility for FDP projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Karolis Cremers", email = "dcc@lumc.com" },
]
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.11",
]
keywords = ["schema", "migration", "FDP", "database"]

[project.urls]
Homepage = "https://example.com"
Repository = "https://example.com/repo"
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "mypy>=1.0",
]
